apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: novelapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fine4life/novelapp-gitops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: novelapp
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
